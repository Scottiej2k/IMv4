<title>Via dei Tigli Narrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root {
  --bg: #F3F5EF; --surface: #FFFFFF; --ink: #1E2923; --muted: #5E6B63; --line: #DCE2D6;
  --accent: #2C6849; --accent-soft: #E3EEE6; --warn: #9A5B0C; --warn-soft: #F7EAD4;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101512; --surface: #171E1A; --ink: #E2E8E3; --muted: #97A49B; --line: #2A342E; --accent: #7CC29C; --accent-soft: #1F2E26; --warn: #E0A95A; --warn-soft: #3A2C17; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #101512; --surface: #171E1A; --ink: #E2E8E3; --muted: #97A49B; --line: #2A342E; --accent: #7CC29C; --accent-soft: #1F2E26; --warn: #E0A95A; --warn-soft: #3A2C17; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 20px; padding-block: 32px 72px; }
h1 { font-family: var(--read); font-weight: 600; font-size: 32px; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 66ch; margin: 0 0 8px; }
.status { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 12px 0 26px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.chip.ok { color: var(--accent); border-color: var(--accent); }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px 16px; margin-bottom: 16px; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.card-h h2 { font-family: var(--read); font-weight: 600; font-size: 21px; margin: 0; }
.about { color: var(--muted); font-size: 13.5px; margin: 2px 0 12px; }
.lines { display: grid; gap: 6px; margin: 0 0 14px; padding-left: 12px; border-left: 3px solid var(--accent-soft); }
.lines .it { font-family: var(--read); font-size: 16px; }
.lines .en { color: var(--muted); font-size: 13px; }
.takes { display: grid; gap: 6px; }
.take { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.take.chosen { border-color: var(--accent); background: var(--accent-soft); }
.take.playing { box-shadow: inset 3px 0 0 var(--accent); }
.play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 14px; display: grid; place-items: center; }
.take.playing .play { background: var(--accent); color: var(--surface); }
.vname { font-weight: 600; }
.vmeta { color: var(--muted); font-size: 13px; }
.pick { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; white-space: nowrap; }
.take.chosen .pick { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.note { width: 100%; margin-top: 10px; font: inherit; font-size: 13.5px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.saved { font-size: 12px; color: var(--muted); min-height: 1.2em; margin-top: 4px; }

@media (max-width: 560px) {
  .take { grid-template-columns: auto minmax(0, 1fr); }
  .pick { grid-column: 1 / -1; justify-self: start; }
}

.passage { font-family: var(--read); font-size: 17px; max-width: 66ch; margin: 0 0 4px; }
.passage-en { color: var(--muted); font-size: 13.5px; max-width: 66ch; margin: 0 0 22px; }
.grid { display: grid; grid-template-columns: minmax(120px, 0.8fr) repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
.colh { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 0 4px 2px; }
.colh b { display: block; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--ink); }
.vcell { padding: 10px 4px; border-top: 1px solid var(--line); }
.cell { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.cell.chosen { border-color: var(--accent); background: var(--accent-soft); }
.cell.playing .play { background: var(--accent); color: var(--surface); }
.cell .pick { margin-left: auto; }
.cell.chosen .pick { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.speed { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); margin: 0 0 18px; }
.speed select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  .colh { display: none; }
  .cell::before { content: attr(data-sname); font-size: 12px; color: var(--muted); min-width: 9em; }
}
</style>

<div class="wrap">
  <h1>Choosing the narrator</h1>
  <p class="lede">The same passage from Chapter 1, read by six voices at three settings. Charon at "Current setting" is what S1E1's audio uses now. Play a few, then choose one. The speed box plays a clip faster so you can hear whether a small speed-up alone would be enough.</p>
  <div class="status" id="status"><span>Loading…</span></div>
  <p class="passage" id="passage"></p>
  <p class="passage-en" id="passage-en"></p>
  <div class="speed"><label for="rate">Play at</label><select id="rate"><option value="1">1× (as recorded)</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option></select></div>
  <div class="grid" id="grid"></div>
  <input class="note" id="note" placeholder="Note (optional): e.g. Algieba, but a touch slower">
  <div class="saved" id="saved"></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let N = null, db = null, pick = {}, playing = null;
  const player = new Audio();
  player.addEventListener("ended", () => { playing = null; render(); });
  const keyOf = (t) => t.voice + "|" + t.style;

  function render() {
    const styles = N.styles;
    let h = `<div></div>` + styles.map((s) => `<div class="colh">Setting<b>${esc(s.name)}</b></div>`).join("");
    const voices = [...new Set(N.takes.map((t) => t.voice))];
    for (const v of voices) {
      const d = N.takes.find((t) => t.voice === v).descr;
      h += `<div class="vcell"><span class="vname">${esc(v)}</span> <span class="vmeta">· ${esc(d)}${v === N.current ? " · current" : ""}</span></div>`;
      for (const s of styles) {
        const t = N.takes.find((x) => x.voice === v && x.style === s.id), k = keyOf(t);
        h += `<div class="cell${pick.take === k ? " chosen" : ""}${playing === k ? " playing" : ""}" data-sname="${esc(s.name)}">
          <button class="play" data-play="${esc(k)}" aria-label="Play ${esc(v)}, ${esc(s.name)}">${playing === k ? "❚❚" : "▶"}</button>
          <button class="pick" data-pick="${esc(k)}">${pick.take === k ? "Chosen" : "Choose"}</button></div>`;
      }
    }
    $("grid").innerHTML = h;
    const [pv, ps] = (pick.take || "|").split("|");
    const sname = N.styles.find((s) => s.id === ps)?.name;
    $("status").innerHTML = (pick.take ? `<span class="chip ok">picked: ${esc(pv)} · ${esc(sname)}</span>` : `<span class="chip">not picked yet</span>`) +
      (db ? `<span class="chip ok">pick saved for Claude</span>` : `<span class="chip warn">pick saved in this browser only</span>`);
  }

  async function save(patch) {
    pick = { ...pick, ...patch, at: new Date().toISOString() };
    try { localStorage.setItem("vdt-narrator", JSON.stringify(pick)); } catch {}
    if (db) {
      try { await db.doc("picks/narrator-v2").set(pick); $("saved").textContent = "Saved."; }
      catch (e) { $("saved").textContent = "Couldn't save to the shared store (" + (e.code || "error") + "); kept in this browser."; }
    } else $("saved").textContent = "Saved in this browser.";
    render();
  }

  document.addEventListener("click", (e) => {
    const p = e.target.closest("[data-play]");
    if (p) {
      const k = p.dataset.play;
      player.pause();
      if (playing === k) { playing = null; render(); return; }
      const t = N.takes.find((x) => keyOf(x) === k);
      playing = k; player.src = t.file; player.playbackRate = +$("rate").value;
      player.play().catch(() => { playing = null; render(); }); render(); return;
    }
    const b = e.target.closest("[data-pick]");
    if (b) save({ take: b.dataset.pick, rate: $("rate").value });
  });
  $("rate").addEventListener("change", () => { player.playbackRate = +$("rate").value; if (pick.take) save({ rate: $("rate").value }); });
  $("note").addEventListener("change", () => save({ note: $("note").value.trim() }));

  (async () => {
    try { pick = JSON.parse(localStorage.getItem("vdt-narrator") || "{}"); } catch { pick = {}; }
    try { N = await (await fetch("narrator.json")).json(); }
    catch { $("status").textContent = "Couldn't load the audition (narrator.json)."; return; }
    $("passage").textContent = N.passage.it; $("passage-en").textContent = N.passage.en;
    $("note").value = pick.note || ""; if (pick.rate) $("rate").value = pick.rate;
    render();
    try {
      db = await window.claude?.use?.("db");
      if (db) {
        const d = await db.doc("picks/narrator-v2").get();
        const data = d.exists ? d.data() : null;
        if (data) { pick = { ...pick, ...data }; $("note").value = pick.note || ""; if (pick.rate) $("rate").value = pick.rate; }
        render();
      }
    } catch { db = null; render(); }
  })();
})();
</script>
