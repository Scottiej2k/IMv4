<title>Via dei Tigli Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --ink: #1E2923;
  --muted: #5E6B63;
  --line: #DCE2D6;
  --accent: #2C6849;
  --accent-soft: #E3EEE6;
  --mark: #E6EFC6;
  --mark-ink: #2A3A12;
  --warn: #9A5B0C;
  --warn-soft: #F7EAD4;
  --tag: #6B5A8E;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101512; --surface: #171E1A; --ink: #E2E8E3; --muted: #97A49B; --line: #2A342E;
    --accent: #7CC29C; --accent-soft: #1F2E26; --mark: #34431F; --mark-ink: #E9F2CF;
    --warn: #E0A95A; --warn-soft: #3A2C17; --tag: #B8A6DE; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101512; --surface: #171E1A; --ink: #E2E8E3; --muted: #97A49B; --line: #2A342E;
  --accent: #7CC29C; --accent-soft: #1F2E26; --mark: #34431F; --mark-ink: #E9F2CF;
  --warn: #E0A95A; --warn-soft: #3A2C17; --tag: #B8A6DE; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); background: var(--surface); padding-block: 20px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { padding-inline: 20px; display: grid; gap: 2px; margin-bottom: 14px; }
.brand b { font-family: var(--read); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12.5px; }
.filter { padding-inline: 20px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.season { padding-inline: 12px; margin-top: 10px; }
.season h3 { margin: 0; padding: 8px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.ch { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
.ch:hover { background: var(--accent-soft); }
.ch[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.ch .id { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.ch.planned .t { color: var(--muted); }
.ch .w { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

.pick { display: none; }
main { padding-inline: 32px; padding-block: 28px 64px; min-width: 0; }
.head { max-width: 1040px; display: grid; gap: 6px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.chip.level { color: var(--accent); border-color: var(--accent); }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
h1 { margin: 0; font-family: var(--read); font-weight: 600; font-size: clamp(26px, 3.4vw, 34px); line-height: 1.15; text-wrap: balance; }
h1 em { font-weight: 400; color: var(--muted); font-size: .6em; display: block; margin-top: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 18px; max-width: 1040px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tools { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding-block: 14px; font-size: 13px; color: var(--muted); max-width: 1040px; }
.tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.panel { max-width: 1040px; }

/* Story: a book page (paragraphs, first-line indents, « » dialogue, thoughts in italics) */
.story { max-width: 64ch; font-family: var(--read); font-size: 18.5px; line-height: 1.75; background: var(--surface); border: 1px solid var(--line); padding: 44px 56px 60px; }
.chap-h { font-family: var(--read); font-weight: 400; font-style: italic; font-size: 15px; color: var(--muted); text-align: center; margin: 36px 0 18px; letter-spacing: .02em; }
.chap-h:first-child { margin-top: 0; }
.chap-h + p { text-indent: 0; }
.story p { margin: 0; text-indent: 1.6em; }
.story p + p { margin-top: .25em; }
.story i { font-style: italic; }
mark.v { background: none; color: inherit; font-weight: 700; }
.seg { cursor: pointer; border-radius: 2px; }
.seg:hover { background: var(--accent-soft); }
.en { display: none; font-family: var(--ui); font-size: 14px; line-height: 1.45; color: var(--muted); text-indent: 0; margin: 2px 0 8px; }
.seg.open + .en, .show-en .en { display: block; }
.show-en .story p { text-indent: 0; }
/* Read-along */
.w.played { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.w.now { background: var(--accent-soft); border-radius: 2px; }
.pop { position: absolute; z-index: 20; display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); font-family: var(--ui); }
.pop button, .pbar button { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.pop button:hover, .pbar button:hover { background: var(--accent-soft); }
.pbar { position: sticky; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: 1040px; margin-top: 18px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px 0 0; font-size: 13px; color: var(--muted); }
.pbar .play { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; min-width: 92px; }
.pbar .play:hover { background: var(--accent); opacity: .9; }
.pbar .msg { flex: 1 1 220px; }
.fmtnote { font-size: 13px; color: var(--warn); background: var(--warn-soft); padding: 6px 10px; border-radius: 6px; max-width: 64ch; margin-bottom: 12px; }

/* Side by side */
.pgrid { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 110px minmax(0,1fr) minmax(0,1fr); gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.prow .sp { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.prow .sp small { display: block; font-family: var(--mono); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 10.5px; }
.prow .it { font-family: var(--read); font-size: 16px; }
.prow .tr { color: var(--muted); }
.prow.scene { grid-template-columns: 1fr; padding-top: 22px; border-bottom-color: var(--ink); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--ink); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.lemma { font-family: var(--read); font-size: 17px; font-weight: 600; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
td .ex { font-family: var(--read); font-size: 15px; }
td .ext { color: var(--muted); font-size: 13px; }
.pos { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* Grammar + notes (markdown) */
.md { max-width: 72ch; font-size: 15.5px; line-height: 1.65; }
.md h1 { font-size: 26px; margin: 8px 0 12px; }
.md h2 { font-family: var(--read); font-weight: 600; font-size: 20px; margin: 28px 0 8px; }
.md h3 { font-size: 15px; margin: 20px 0 6px; }
.md table { margin: 12px 0; }
.md code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.md blockquote { margin: 10px 0; padding-left: 14px; border-left: 3px solid var(--mark); }
.md strong { color: var(--ink); }
.md em { font-family: var(--read); }

/* Audio script */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chunk { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; margin-bottom: 10px; }
.chunk-h { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.chunk-h .n { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.tline { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 14px; padding: 8px 14px; }
.tline + .tline { border-top: 1px dashed var(--line); }
.tline .sp { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.tline .sp small { display: block; font-family: var(--mono); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
.tline .txt { font-family: var(--read); font-size: 16px; }
.tline .sty { display: none; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.show-style .tline .sty { display: block; }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; margin-bottom: 14px; }

/* Notes */
.plan { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 8px 16px; max-width: 80ch; margin: 0 0 28px; }
.plan dt { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.plan dd { margin: 0; }
.section-h { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.empty { padding: 40px 0; color: var(--muted); max-width: 60ch; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .pick { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .pick select { flex: 1; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  main { padding-inline: 16px; padding-block: 16px 48px; }
  .prow, .tline { grid-template-columns: 1fr; gap: 2px; }
  .plan { grid-template-columns: 1fr; gap: 2px; }
  .plan dd { margin-bottom: 10px; }
  .story { font-size: 17px; padding: 24px 18px 36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <nav class="side" aria-label="Chapters">
    <div class="brand"><b>Via dei Tigli</b><span>Chapter review · A1 → B2</span></div>
    <label class="filter"><input type="checkbox" id="only-written" checked> Written chapters only</label>
    <div id="list"></div>
  </nav>
  <main>
    <div class="pick"><select id="pick" aria-label="Chapter"></select></div>
    <header class="head" id="head"><div class="empty">Loading chapters…</div></header>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools" id="tools"></div>
    <section class="panel" id="panel"></section>
  </main>
</div>

<script>
(() => {
  const TABS = [["story", "Story"], ["parallel", "Side by side"], ["vocab", "Vocabulary"],
                ["grammar", "Grammar"], ["tts", "Audio script"], ["notes", "Plan & notes"]];
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("vdt-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("vdt-" + k, JSON.stringify(v)); } catch {} },
  };
  let INDEX = null, cur = null, data = null;
  let tab = store.get("tab", "story");
  const cache = {};

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<mark class="v">$1</mark>')
    .replace(/&lt;([a-z -]+)&gt;/g, '<span class="atag">$1</span>')
    .replace(/(^|[^\w])_(.+?)_(?![\w])/g, "$1<i>$2</i>");
  const who = (id) => (INDEX.speakers[id] || id || "").replace(/^Narratore$/, "Narratore");
  const loc = (id) => INDEX.locations[id] || id;
  const md = (s) => (window.marked ? window.marked.parse(s || "") : "<pre>" + esc(s) + "</pre>");

  function seasonOf(id) { return id.slice(0, 3); }

  function renderList() {
    const only = $("only-written").checked;
    const bySeason = {};
    for (const c of INDEX.chapters) (bySeason[seasonOf(c.id)] ||= []).push(c);
    let html = "";
    for (const [s, chs] of Object.entries(bySeason)) {
      const shown = only ? chs.filter((c) => c.stats) : chs;
      if (!shown.length) continue;
      const written = chs.filter((c) => c.stats).length;
      html += `<div class="season"><h3><span>Season ${+s.slice(1)} · ${esc(chs[0].level)}${chs.at(-1).level !== chs[0].level ? "–" + esc(chs.at(-1).level) : ""}</span><span>${written}/${chs.length}</span></h3>`;
      for (const c of shown) {
        html += `<button class="ch${c.stats ? "" : " planned"}" data-id="${c.id}" aria-current="${c.id === cur}">
          <span class="id">${c.id.toUpperCase()}</span><span class="t">${esc(c.title.it)}</span>
          <span class="w">${c.stats ? c.stats.words.toLocaleString() : ""}</span></button>`;
      }
      html += "</div>";
    }
    $("list").innerHTML = html || '<p class="empty" style="padding-inline:20px">No chapters written yet.</p>';
    $("pick").innerHTML = INDEX.chapters.filter((c) => !only || c.stats)
      .map((c) => `<option value="${c.id}"${c.id === cur ? " selected" : ""}>${c.id.toUpperCase()} · ${esc(c.title.it)}${c.stats ? "" : " (planned)"}</option>`).join("");
  }

  function renderTabs() {
    $("tabs").innerHTML = TABS.map(([k, label]) =>
      `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k === tab}">${label}</button>`).join("");
  }

  function header(c) {
    const s = c.stats;
    const target = INDEX.levels[c.level]?.words;
    let warn = "";
    if (s && target && (s.words < target[0] || s.words > target[1])) warn += `<span class="chip warn">length outside ${target[0].toLocaleString()}–${target[1].toLocaleString()}</span>`;
    if (s && (s.dialogue < 45 || s.dialogue > 60)) warn += `<span class="chip warn">dialogue outside 45–60%</span>`;
    $("head").innerHTML = `
      <div class="eyebrow"><span class="chip level">${esc(c.level)}</span><span>Season ${+c.id.slice(1, 3)}, episode ${+c.id.slice(4)}</span><span>·</span><span>${esc(c.grammar)}</span>${warn}</div>
      <h1>${esc(c.title.it)}<em>${esc(c.title.en)}</em></h1>
      ${s ? `<div class="stats"><span><b>${s.words.toLocaleString()}</b> words</span><span><b>${s.dialogue}%</b> dialogue</span><span><b>${s.scenes}</b> scenes</span><span><b>${s.segments}</b> sentences</span><span><b>${s.vocab}</b> vocabulary items</span></div>` : ""}`;
  }

  function segIndex() {
    const m = {};
    for (const sc of data.chapter.scenes) for (const p of sc.paragraphs) for (const s of p.segments) m[s.id] = s;
    return m;
  }

  const sceneTitle = (sc) => sc.location === "confessionale" || sc.kind === "confessionale" || !sc.location
    ? `Confessionale${sc.characters?.length ? " · " + esc(who(sc.characters[0])) : ""}`
    : `${esc(loc(sc.location))}${sc.time ? " · " + esc(sc.time) : ""}`;

  function story() {
    const showEn = store.get("show-en", false);
    const c = INDEX.chapters.find((x) => x.id === cur);
    $("tools").innerHTML = `<label><input type="checkbox" id="t-en"${showEn ? " checked" : ""}> Show English under every sentence</label><span>Tap a sentence to play from there or see its translation.</span>`;
    if (c.format === "script") {
      $("tools").innerHTML = "";
      return `<p class="fmtnote">This chapter was written in the old script format and is being rewritten as a book. Its other tabs still work.</p>`;
    }
    let html = "";
    html += `<div class="${showEn ? "show-en" : ""}" id="story"><article class="story">`;
    for (const sc of data.chapter.scenes) {
      html += `<h2 class="chap-h">${sceneTitle(sc)}</h2>`;
      for (const p of sc.paragraphs) {
        html += "<p>" + p.segments.map((s) => `<span class="seg" data-seg="${s.id}" title="${s.id}">${wordsHtml(s)}</span> <span class="en">${fmt(s.en)}</span>`).join(" ") + "</p>";
      }
    }
    return html + "</article></div>";
  }

  function parallel() {
    $("tools").innerHTML = `<span>One row per sentence. Tap an Italian sentence to play from there.</span>`;
    let html = '<div class="pgrid">';
    for (const sc of data.chapter.scenes) {
      html += `<div class="prow scene">${sc.n} · ${sceneTitle(sc)}</div>`;
      for (const p of sc.paragraphs) for (const s of p.segments) {
        const voices = [...new Set((s.voice || []).map((v) => v[0]).filter((v) => v !== "narrator"))];
        html += `<div class="prow"><div class="sp">${voices.map((v) => esc(who(v))).join(", ")}<small>${s.id.slice(7)}</small></div><div class="it seg" data-seg="${s.id}">${wordsHtml(s)}</div><div class="tr">${fmt(s.en)}</div></div>`;
      }
    }
    return html + "</div>";
  }

  function vocab() {
    const segs = segIndex();
    const uses = {};
    for (const s of Object.values(segs)) for (const f of s.focus || []) uses[f] = (uses[f] || 0) + 1;
    $("tools").innerHTML = `<span>“Uses” counts sentences where the item is bolded; the target is at least 3.</span>`;
    const rows = data.chapter.vocab.map((v) => {
      const ex = segs[v.example];
      const n = uses[v.id] || 0;
      return `<tr><td class="lemma">${esc(v.lemma)}</td><td><span class="pos">${esc(v.pos)}</span></td><td>${esc(v.en)}${v.note ? `<div class="ext">${esc(v.note)}</div>` : ""}</td>
        <td>${ex ? `<div class="ex">${fmt(ex.it)}</div><div class="ext">${fmt(ex.en)}</div>` : '<span class="ext">—</span>'}</td>
        <td class="num">${n < 3 ? `<span class="chip warn">${n}</span>` : n}</td></tr>`;
    }).join("");
    return `<div class="tablewrap"><table><thead><tr><th>Italian</th><th>Type</th><th>English</th><th>Example from the story</th><th style="text-align:right">Uses</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function grammar() {
    $("tools").innerHTML = `<span>Quoted lines are linked to their sentence ids.</span>`;
    return `<div class="md">${md(data.grammar)}</div>`;
  }

  function tts() {
    const t = data.tts;
    if (!t) { $("tools").innerHTML = ""; return '<p class="empty">No audio script for this chapter.</p>'; }
    const showStyle = store.get("show-style", false);
    const voices = {};
    let chars = 0;
    for (const c of t.chunks) { for (const [sp, v] of Object.entries(c.voices)) voices[sp] = v; for (const l of c.lines) chars += l.text.length; }
    $("tools").innerHTML = `<label><input type="checkbox" id="t-style"${showStyle ? " checked" : ""}> Show delivery notes</label><span class="chip">${esc(t.model)}</span><span>${t.chunks.length} requests · ${chars.toLocaleString()} characters · at most 2 voices per request</span>`;
    let html = `<p class="note">${esc(t.notes || "")}</p><div class="legend">${Object.entries(voices).map(([sp, v]) => `<span class="chip">${esc(who(sp))} → ${esc(v)}</span>`).join("")}</div><div class="${showStyle ? "show-style" : ""}" id="ttsbox">`;
    for (const c of t.chunks) {
      html += `<div class="chunk"><div class="chunk-h"><span class="n">Request ${c.index + 1}</span><span>scene ${c.scene}</span><span>${Object.entries(c.voices).map(([sp, v]) => esc(who(sp)) + " (" + esc(v) + ")").join(" + ")}</span><span>${c.segments} sentences</span></div>`;
      for (const l of c.lines) {
        html += `<div class="tline"><div class="sp">${esc(who(l.who))}<small>${esc(c.voices[l.who] || "")}</small></div><div><div class="txt">${fmt(l.text)}</div><div class="sty">${esc(l.style)}</div></div></div>`;
      }
      html += "</div>";
    }
    return html + "</div>";
  }

  function notes(c) {
    $("tools").innerHTML = "";
    const p = c.plan || {};
    const rows = [["Theme", p.theme], ["A-plot", p.a_plot], ["B-plot", p.b_plot], ["Runner", p.runner], ["Arc", p.arc],
                  ["Key words", (p.key_vocab || []).join(", ")], ["Grammar", c.grammar]].filter(([, v]) => v);
    let html = `<h2 class="section-h">Chapter plan</h2><dl class="plan">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
    if (data && data.continuity) html += `<h2 class="section-h">Continuity log entry</h2><div class="md">${md(data.continuity.replace(/^###[^\n]*\n/, ""))}</div>`;
    return html;
  }

  function renderPanel() {
    const c = INDEX.chapters.find((x) => x.id === cur);
    renderTabs();
    if (!c.stats) {
      $("tools").innerHTML = "";
      $("panel").innerHTML = `<p class="empty">This chapter hasn't been written yet. Its plan is below.</p>` + notes(c);
      $("tabs").hidden = true;
      return;
    }
    $("tabs").hidden = false;
    if (!data) { $("panel").innerHTML = '<p class="empty">Loading chapter…</p>'; return; }
    const views = { story, parallel, vocab, grammar, tts, notes: () => notes(c) };
    $("panel").innerHTML = views[tab]() + (tab === "story" || tab === "parallel" ? playerBar() : "");
    applyPlayed();
  }

  async function open(id) {
    if (!INDEX.chapters.some((c) => c.id === id)) id = (INDEX.chapters.find((c) => c.stats) || INDEX.chapters[0]).id;
    stopPlayer(); closePop();
    cur = id; data = null;
    store.set("chapter", id);
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    const c = INDEX.chapters.find((x) => x.id === id);
    header(c); renderList(); renderPanel();
    if (!c.stats) return;
    try {
      data = cache[id] ||= await (await fetch("data/" + id + ".json")).json();
    } catch (e) {
      $("panel").innerHTML = `<p class="empty">Couldn't load this chapter's data (data/${id}.json). Rebuild the reader with scripts/build_reader.py and republish.</p>`;
      return;
    }
    if (cur === id) renderPanel();
    window.scrollTo(0, 0);
  }


  // ---------------------------------------------------------------- read-along (demo voice)
  // The real audio will come with timing.json (docs/read-along.md). Until then the browser's own
  // Italian voice reads the chapter and reports each word as it speaks, which drives the same UI:
  // underline as it plays, keep played words underlined, play from any sentence, resume.
  const WORD = /[0-9A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF]+(?:['\u2019][0-9A-Za-z\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF]+)*/g;
  const P = { queue: [], k: 0, playing: false, timers: [], boundary: false, voice: null };

  function wordsHtml(s) {
    if (!s.tokens) return fmt(s.it);
    return s.tokens.map(([t, w, f]) => {
      let h = esc(t);
      if (w >= 0) h = `<span class="w" data-w="${s.id}.${w}">${h}</span>`;
      if (f.includes("b")) h = `<mark class="v">${h}</mark>`;
      if (f.includes("i")) h = `<i>${h}</i>`;
      return h;
    }).join("");
  }

  function buildQueue() {
    const q = [];
    for (const sc of data.chapter.scenes) for (const p of sc.paragraphs) for (const s of p.segments) {
      let wi = 0;
      for (const [who, raw] of s.voice || []) {
        const text = raw.replace(/\*\*/g, "").replace(/<[^>]+>/g, " ").replace(/[«»_]/g, "").replace(/\s+/g, " ").trim();
        const words = [], offs = [];
        for (const m of text.matchAll(WORD)) { words.push(`${s.id}.${wi++}`); offs.push(m.index); }
        if (text) q.push({ seg: s.id, who, text, words, offs });
      }
    }
    return q;
  }

  const playedKey = () => "played-" + cur;
  function playedMap() { return store.get(playedKey(), {}); }
  function markPlayed(id) {
    const [seg, n] = [id.slice(0, id.lastIndexOf(".")), +id.slice(id.lastIndexOf(".") + 1)];
    const m = playedMap();
    if ((m[seg] ?? -1) < n) { m[seg] = n; store.set(playedKey(), m); }
    document.querySelectorAll(`[data-w="${id}"]`).forEach((el) => el.classList.add("played"));
    document.querySelectorAll(".w.now").forEach((el) => el.classList.remove("now"));
    const el = document.querySelector(`[data-w="${id}"]`);
    if (el) {
      el.classList.add("now");
      const r = el.getBoundingClientRect();
      if (r.top < 80 || r.bottom > innerHeight - 120) el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  function applyPlayed() {
    const m = playedMap();
    document.querySelectorAll("[data-w]").forEach((el) => {
      const id = el.dataset.w, i = id.lastIndexOf(".");
      if ((m[id.slice(0, i)] ?? -1) >= +id.slice(i + 1)) el.classList.add("played");
    });
  }

  function pickVoice() {
    if (!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices().filter((v) => /^it/i.test(v.lang));
    return vs.find((v) => v.localService) || vs[0] || null;
  }
  function pitchFor(who) {
    if (who === "narrator") return 1;
    let h = 0; for (const c of who) h = (h * 31 + c.charCodeAt(0)) % 997;
    return 0.75 + (h % 60) / 100; // 0.75–1.34: tells characters apart
  }

  function speak() {
    const it = P.queue[P.k];
    if (!P.playing) return;
    if (!it) { stopPlayer(); store.set("pos-" + cur, 0); updateBar("Finished. Every word you heard stays underlined."); return; }
    store.set("pos-" + cur, P.k);
    const u = new SpeechSynthesisUtterance(it.text);
    u.lang = "it-IT";
    if (P.voice) u.voice = P.voice;
    const level = INDEX.chapters.find((x) => x.id === cur).level;
    u.rate = { A1: 0.85, A2: 0.9, B1: 1, B2: 1 }[level] || 1;
    u.pitch = pitchFor(it.who);
    P.boundary = false;
    u.onstart = () => {
      // Some voices never report word boundaries: then estimate from the text's length.
      const perChar = 1000 / (14 * u.rate);
      it.offs.forEach((o, j) => P.timers.push(setTimeout(() => { if (!P.boundary) markPlayed(it.words[j]); }, o * perChar)));
    };
    u.onboundary = (e) => {
      if (e.name && e.name !== "word") return;
      P.boundary = true;
      let j = -1; for (let x = 0; x < it.offs.length; x++) if (it.offs[x] <= e.charIndex) j = x;
      for (let x = 0; x <= j; x++) markPlayed(it.words[x]);
    };
    u.onend = () => {
      clearTimers();
      if (!P.playing) return;
      it.words.forEach(markPlayed);
      P.k++; speak();
    };
    speechSynthesis.speak(u);
    updateBar();
  }
  function clearTimers() { P.timers.forEach(clearTimeout); P.timers = []; }
  function startAt(k) {
    if (!("speechSynthesis" in window)) return updateBar("This browser has no speech voice, so the demo can't play here.");
    P.voice = pickVoice();
    P.queue = buildQueue();
    P.k = Math.max(0, Math.min(k, P.queue.length - 1));
    P.playing = true;
    speechSynthesis.cancel(); clearTimers();
    speak();
  }
  function stopPlayer() {
    P.playing = false; clearTimers();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    document.querySelectorAll(".w.now").forEach((el) => el.classList.remove("now"));
  }

  function playerBar() {
    const pos = store.get("pos-" + cur, 0);
    const resume = pos > 0 ? `<button data-act="resume">Resume where you left off</button>` : "";
    return `<div class="pbar" id="pbar"><button class="play" data-act="toggle">${P.playing ? "Pause" : "▶ Play"}</button>${resume}
      <button data-act="clear">Clear underlines</button><span class="msg" id="pmsg">Demo voice: your browser's Italian voice. The finished course uses the Gemini voices, with the same underlining.</span></div>`;
  }
  function updateBar(msg) {
    const bar = $("pbar"); if (!bar) return;
    bar.outerHTML = playerBar();
    if (msg) $("pmsg").textContent = msg;
  }
  function playerAction(act, seg) {
    closePop();
    if (act === "toggle") { if (P.playing) { stopPlayer(); updateBar(); } else startAt(store.get("pos-" + cur, 0)); }
    if (act === "resume") startAt(store.get("pos-" + cur, 0));
    if (act === "clear") { stopPlayer(); store.set(playedKey(), {}); store.set("pos-" + cur, 0); document.querySelectorAll(".w.played").forEach((el) => el.classList.remove("played")); updateBar(); }
    if (act === "from") { const q = buildQueue(); startAt(Math.max(0, q.findIndex((x) => x.seg === seg))); }
    if (act === "en") { const el = document.querySelector(`.story [data-seg="${seg}"]`); if (el) el.classList.toggle("open"); }
  }

  function openPop(sg, e) {
    closePop();
    const pop = document.createElement("div");
    pop.className = "pop"; pop.id = "pop";
    const seg = sg.dataset.seg;
    pop.innerHTML = `<button data-act="from" data-seg="${seg}">▶ Play from here</button>` +
      (sg.closest(".story") ? `<button data-act="en" data-seg="${seg}">Translation</button>` : "");
    document.body.appendChild(pop);
    const r = sg.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(e.pageX - 20, innerWidth - pop.offsetWidth - 8)) + "px";
    pop.style.top = (r.top + scrollY - pop.offsetHeight - 6) + "px";
  }
  function closePop() { const p = $("pop"); if (p) p.remove(); }
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { P.voice = pickVoice(); };

  document.addEventListener("click", (e) => {
    const ch = e.target.closest(".ch"); if (ch) return open(ch.dataset.id);
    const tb = e.target.closest(".tab"); if (tb) { tab = tb.dataset.tab; store.set("tab", tab); return renderPanel(); }
    const act = e.target.closest("[data-act]"); if (act) return playerAction(act.dataset.act, act.dataset.seg);
    const sg = e.target.closest(".seg"); if (sg) return openPop(sg, e);
    closePop();
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "pick") open(e.target.value);
    if (e.target.id === "only-written") { store.set("only", e.target.checked); renderList(); }
    if (e.target.id === "t-en") { store.set("show-en", e.target.checked); $("story").classList.toggle("show-en", e.target.checked); }
    if (e.target.id === "t-style") { store.set("show-style", e.target.checked); $("ttsbox").classList.toggle("show-style", e.target.checked); }
  });
  window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== cur) open(id); });

  (async () => {
    try {
      INDEX = await (await fetch("index.json")).json();
    } catch (e) {
      $("head").innerHTML = '<p class="empty">Couldn\'t load the chapter index (index.json). Rebuild the reader with scripts/build_reader.py and republish.</p>';
      return;
    }
    $("only-written").checked = store.get("only", true);
    open(location.hash.slice(1) || store.get("chapter", ""));
  })();
})();
</script>
